[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-scout"
version = "0.1.0"
description = "Bounded video discovery and downloading in a Textual terminal"
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<9", "httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5", "yt-dlp>=2025.3.31"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
video-scout = "video_scout.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
